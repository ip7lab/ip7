server {
    listen 80;
    server_name ip7.de5.net;
    access_log /www/sites/ip7.de5.net/log/access.log main;
    error_log /www/sites/ip7.de5.net/log/error.log;
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }
    location ^~ /.well-known/pki-validation/ {
        allow all;
        root /usr/share/nginx/html;
    }
    location = /privacy.html {
        root /www/sites/ip7.de5.net/index;
    }
    location ^~ /scenarios/ {
        root /www/sites/ip7.de5.net/index;
    }
    location / {
        proxy_pass http://127.0.0.1:18968;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html application/javascript text/javascript;
        sub_filter_once off;
        sub_filter "</body>" "<div style=\"max-width:960px;margin:24px auto;padding:16px;border-top:1px solid #ddd;font-family:system-ui,sans-serif;font-size:14px;line-height:1.7;color:#333\">IP7 检测：先看上方检测结果，再按场景对照清单 —— <a href=\"/scenarios/ecommerce.html\">跨境电商注册</a> · <a href=\"/scenarios/ai.html\">AI 工具</a> · <a href=\"/scenarios/finance.html\">金融与加密账户</a> · <a href=\"/scenarios/phone.html\">境外电话办理</a> · <a href=\"/privacy.html\">隐私政策</a><br>本页部分推荐链接为联盟链接，点击购买后本站可能获得返佣，不影响你的价格；推荐基于本站实测，排名不受返佣影响。住宅 / 代理 / 机房判断为 ASN 启发式推测，标注置信度与来源，不对“纯净度”下断言；无数据源指标标注“无法检测”。<br>本站基于开源项目 MyIP 构建，遵循 AGPL-3.0 协议 · <a href=\"https://github.com/ip7lab/ip7\">源代码</a></div></body>";
    }
}

